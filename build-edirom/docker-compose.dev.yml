services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: korngold-dev
    working_dir: /app
    volumes:
      # Mount the entire project (from workspace root)
      - ../../:/app
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    # Use host network to avoid bridge issues
    network_mode: host
    # Interactive bash shell
    command: /bin/bash
